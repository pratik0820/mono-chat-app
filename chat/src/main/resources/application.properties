# ═══════════════════════════════════════════════════════════════════════
# THEME IMAGE UPLOADS (Chunk 4)
# ═══════════════════════════════════════════════════════════════════════

# Relative dir is fine for local dev (auto-created). On EC2 set an absolute
# dir, e.g. chat.uploads.dir=/var/chat-uploads (writable by the service user).
chat.uploads.dir=uploads
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB
