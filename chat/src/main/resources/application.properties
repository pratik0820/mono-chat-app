spring.application.name=chat
server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5432/chat
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.main.allow-circular-references=true

# Bind to all interfaces so a physical phone on your LAN can reach the backend
server.address=0.0.0.0
# Include the error message in API error responses (shown in the mobile app)
server.error.include-message=always

# Secrets - override via env vars when you deploy
jwt.secret=change-me-to-a-long-random-string-at-least-32-chars
jwt.expiration-ms=86400000
ai.api-key=

# ═══════════════════════════════════════════════════════════════════════
# LOGGING CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════

# Root level — change to INFO in production
logging.level.root=INFO

# Application package — DEBUG to see service/controller AOP logs
logging.level.com.example.chat=DEBUG

# Spring Security — only WARN (very noisy at INFO)
logging.level.org.springframework.security=WARN

# Hibernate SQL — set to DEBUG to see all queries
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.web.socket=WARN
logging.level.org.springframework.messaging.simp=WARN

# ─── JPA / Hibernate startup tuning ───
# Skip bytecode enhancer scan (not needed for ddl-auto=update)
spring.jpa.properties.hibernate.enhancer.skip=true
# Skip schema validation on startup (ddl-auto=update handles it)
spring.jpa.properties.hibernate.schema_validation=false
# Lazy init for non-essential beans (faster cold start)
spring.main.lazy-initialization=false

# File encoding
logging.charset.console=UTF-8
logging.charset.file=UTF-8

